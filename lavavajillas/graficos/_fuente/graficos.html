<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gráficos · Dentro del lavavajillas</title>
<style>
  :root {
    --agua: #4fd6ff;
    --agua2: #9be9ff;
    --limpio: #3ef0a0;
    --sucio: #ff6b4a;
    --calor: #ffb547;
    --enzima: #b98cff;
    --texto: #ffffff;
    --suave: rgba(222, 238, 255, 0.92);
    --tenue: rgba(190, 215, 240, 0.70);
    --panel: linear-gradient(180deg, rgba(12, 32, 52, 0.80), rgba(5, 15, 27, 0.82));
    --borde: rgba(140, 225, 255, 0.42);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif;
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  body.preview { background: radial-gradient(ellipse at 40% 30%, #3b4f63 0%, #16222f 55%, #070c12 100%); }

  .lienzo { position: absolute; inset: 0; }

  /* --- piezas comunes --- */
  .panel {
    position: absolute;
    background: var(--panel);
    border: 2px solid var(--borde);
    border-radius: 36px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.50), inset 0 1.5px 0 rgba(255, 255, 255, 0.16);
    padding: 44px 50px;
  }
  .ceja {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 27px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--acento, var(--agua));
    display: flex; align-items: center; gap: 14px;
  }
  .ceja.sin-punto::before { display: none; }
  .ceja::before {
    content: ""; width: 14px; height: 14px; border-radius: 50%;
    background: var(--acento, var(--agua));
    box-shadow: 0 0 16px var(--acento, var(--agua));
  }
  .titulo {
    font-family: "Inter Display", "Inter", sans-serif;
    font-weight: 900;
    font-size: 76px;
    line-height: 0.98;
    letter-spacing: -0.015em;
    margin-top: 16px;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  }
  .cuerpo { font-size: 38px; font-weight: 500; line-height: 1.28; color: var(--suave); margin-top: 18px; }
  .cuerpo b { color: #fff; font-weight: 800; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .sombra-texto { text-shadow: 0 3px 18px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.6); }

  .fila { display: flex; align-items: center; gap: 26px; }
  .icono {
    flex: none; width: 96px; height: 96px; border-radius: 28px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--acento, var(--agua)) 18%, transparent);
    border: 2px solid color-mix(in srgb, var(--acento, var(--agua)) 55%, transparent);
  }
  .icono svg { width: 58px; height: 58px; }

  .pastilla {
    display: inline-flex; align-items: center; gap: 12px; white-space: nowrap;
    padding: 12px 24px; border-radius: 999px;
    font-weight: 800; font-size: 32px; letter-spacing: 0.02em;
    background: color-mix(in srgb, var(--acento, var(--agua)) 20%, rgba(0, 0, 0, 0.25));
    border: 2px solid color-mix(in srgb, var(--acento, var(--agua)) 70%, transparent);
    color: #fff;
  }

  /* --- rótulo de fase --- */
  .fase {
    position: absolute; left: 64px; top: 280px;
    display: flex; align-items: stretch;
    border-radius: 26px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    border: 2px solid color-mix(in srgb, var(--acento) 60%, transparent);
  }
  .fase .num {
    background: var(--acento); color: #04121f;
    font-family: "Inter Display"; font-weight: 900;
    padding: 22px 30px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-size: 24px; letter-spacing: 0.18em; line-height: 1;
  }
  .fase .num big { font-size: 74px; letter-spacing: -0.02em; margin-top: 4px; }
  .fase .nom {
    background: var(--panel);
    padding: 22px 36px 20px 32px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .fase .nom strong { font-family: "Inter Display"; font-weight: 900; font-size: 64px; letter-spacing: -0.01em; line-height: 1; }
  .fase .barra { display: flex; gap: 10px; margin-top: 16px; }
  .fase .barra i { width: 70px; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.18); }
  .fase .barra i.on { background: var(--acento); box-shadow: 0 0 14px var(--acento); }
  .fase .barra i.hecho { background: rgba(255, 255, 255, 0.55); }

  /* --- medidor del sensor --- */
  .medidor { margin-top: 30px; }
  .medidor .rot { display: flex; justify-content: space-between; align-items: baseline; }
  .medidor .rot span { font-size: 30px; font-weight: 700; letter-spacing: 0.14em; color: var(--tenue); }
  .medidor .rot b { font-family: "JetBrains Mono"; font-weight: 800; font-size: 120px; line-height: 1; color: var(--acento); text-shadow: 0 0 30px color-mix(in srgb, var(--acento) 60%, transparent); }
  .medidor .tubo {
    margin-top: 18px; height: 38px; border-radius: 20px;
    background: rgba(255, 255, 255, 0.10);
    border: 2px solid rgba(255, 255, 255, 0.18);
    overflow: hidden; position: relative;
  }
  .medidor .tubo i {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 18px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--acento) 55%, #000), var(--acento));
    box-shadow: 0 0 24px var(--acento);
  }
  .medidor .marcas { display: flex; justify-content: space-between; margin-top: 10px; font-family: "JetBrains Mono"; font-size: 24px; color: var(--tenue); }

  /* --- tarjetas de programa --- */
  .modo { position: absolute; left: 64px; right: 140px; top: 300px; padding: 46px 52px 50px; }
  .modo .cabeza { display: flex; align-items: center; gap: 30px; }
  .modo .cabeza .icono { width: 128px; height: 128px; border-radius: 36px; }
  .modo .cabeza .icono svg { width: 76px; height: 76px; }
  .modo .nombre { font-family: "Inter Display"; font-weight: 900; font-size: 104px; letter-spacing: -0.02em; line-height: 0.95; }
  .modo .datos { display: flex; gap: 16px; margin-top: 34px; flex-wrap: wrap; }
  .modo .para { font-size: 42px; font-weight: 600; color: var(--suave); margin-top: 26px; }
  .modo .para b { color: #fff; }
</style>
</head>
<body>
<div class="lienzo" id="lienzo"></div>

<script>
// ---------------------------------------------------------------------------
// Iconos (SVG de trazo, heredan el color con currentColor)
// ---------------------------------------------------------------------------
const S = (d, extra = "") => `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const IC = {
  gota: S(`<path d="M32 6 C24 18 14 28 14 40 a18 18 0 0 0 36 0 C50 28 40 18 32 6Z"/><path d="M24 42 a8 8 0 0 0 8 8"/>`),
  ciclo: S(`<path d="M50 26 A20 20 0 0 0 14 22"/><path d="M14 10 v12 h12"/><path d="M14 38 A20 20 0 0 0 50 42"/><path d="M50 54 v-12 h-12"/>`),
  giro: S(`<path d="M10 32 h44"/><circle cx="32" cy="32" r="5"/><path d="M54 32 l-6 -8"/><path d="M10 32 l6 8"/><path d="M44 12 A24 24 0 0 1 56 22" stroke-dasharray="1 0"/><path d="M56 14 v9 h-9"/>`),
  filtro: S(`<rect x="18" y="10" width="28" height="44" rx="6"/><path d="M18 22 h28 M18 32 h28 M18 42 h28 M28 10 v44 M36 10 v44" stroke-width="3"/>`),
  termo: S(`<path d="M26 10 a6 6 0 0 1 12 0 v26 a12 12 0 1 1 -12 0 Z"/><circle cx="32" cy="46" r="5" fill="currentColor"/><path d="M32 46 V22"/>`),
  reloj: S(`<circle cx="32" cy="34" r="22"/><path d="M32 22 v12 l9 6"/><path d="M26 6 h12"/>`),
  frasco: S(`<path d="M24 8 h16 M27 8 v16 L12 50 a5 5 0 0 0 4 8 h32 a5 5 0 0 0 4 -8 L37 24 V8"/><path d="M18 40 h28"/>`),
  chorro: S(`<path d="M12 50 C20 40 26 30 30 14"/><path d="M24 52 C32 42 38 30 42 16"/><path d="M36 54 C44 44 50 34 54 22"/>`),
  ojo: S(`<path d="M4 32 C14 16 50 16 60 32 C50 48 14 48 4 32Z"/><circle cx="32" cy="32" r="8"/>`),
  check: S(`<path d="M14 34 l12 12 l24 -26"/>`),
  cruz: S(`<path d="M18 18 l28 28 M46 18 l-28 28"/>`),
  abajo: S(`<path d="M32 10 v40 M16 36 l16 16 l16 -16"/>`),
  llama: S(`<path d="M32 6 C40 18 48 24 48 38 a16 16 0 0 1 -32 0 C16 28 24 24 26 14 C30 22 34 24 32 6Z"/><path d="M32 54 a7 7 0 0 1 -7 -8 c0 -6 7 -8 7 -14 c0 6 7 8 7 14 a7 7 0 0 1 -7 8Z"/>`),
  copa: S(`<path d="M18 8 h28 c0 16 -4 26 -14 28 c-10 -2 -14 -12 -14 -28Z"/><path d="M32 36 v18 M22 56 h20"/>`),
  rayo: S(`<path d="M36 4 L14 36 h16 l-4 24 l22 -32 h-16 Z"/>`),
  auto: S(`<circle cx="32" cy="32" r="22"/><path d="M22 40 l10 -20 l10 20 M25 34 h14"/>`),
  hoja: S(`<path d="M12 52 C12 26 30 10 54 10 C54 34 38 52 12 52Z"/><path d="M12 52 C24 40 32 32 42 22"/>`),
  olla: S(`<path d="M10 26 h44 v18 a10 10 0 0 1 -10 10 H20 a10 10 0 0 1 -10 -10Z"/><path d="M4 30 h6 M54 30 h6 M24 18 c0 -6 16 -6 16 0"/>`),
  vapor: S(`<path d="M20 52 c-6 -8 6 -12 0 -20 s6 -12 0 -20"/><path d="M32 52 c-6 -8 6 -12 0 -20 s6 -12 0 -20"/><path d="M44 52 c-6 -8 6 -12 0 -20 s6 -12 0 -20"/>`),
  copo: S(`<path d="M32 6 v52 M9.5 19 l45 26 M9.5 45 l45 -26"/><path d="M26 10 l6 6 l6 -6 M26 54 l6 -6 l6 6"/>`),
  puerta: S(`<rect x="12" y="8" width="40" height="48" rx="5"/><path d="M12 20 h40"/><path d="M22 14 h4"/><path d="M44 30 c4 4 4 10 0 14" /><path d="M52 26 l8 -6"/>`),
  piedra: S(`<path d="M10 40 L18 18 L36 10 L54 22 L56 42 L38 54 L18 52 Z"/><circle cx="26" cy="30" r="3" fill="currentColor"/><circle cx="40" cy="26" r="3" fill="currentColor"/><circle cx="38" cy="40" r="3" fill="currentColor"/><circle cx="26" cy="43" r="2.5" fill="currentColor"/>`),
  bolitas: S(`<circle cx="20" cy="22" r="9"/><circle cx="42" cy="20" r="8"/><circle cx="30" cy="40" r="9"/><circle cx="50" cy="40" r="7"/><circle cx="14" cy="46" r="6"/>`),
  basura: S(`<path d="M12 18 h40 M26 18 v-6 h12 v6 M16 18 l3 38 h26 l3 -38"/><path d="M27 28 v18 M37 28 v18"/>`),
  plato: S(`<circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="13"/>`),
};

// ---------------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------------
const fase = (n, nombre, color) => `
  <div class="fase" style="--acento:${color}">
    <div class="num">FASE<big>${n}</big></div>
    <div class="nom">
      <strong class="sombra-texto">${nombre}</strong>
      <div class="barra">${[1, 2, 3, 4].map(i => `<i class="${i < n ? "hecho" : i === n ? "on" : ""}"></i>`).join("")}</div>
    </div>
  </div>`;

const callout = ({ top = 300, left = 64, width = 760, acento = "var(--agua)", icono, ceja, titulo, cuerpo = "" }) => `
  <div class="panel" style="top:${top}px; left:${left}px; width:${width}px; --acento:${acento}">
    <div class="fila">
      <div class="icono" style="color:${acento}">${IC[icono]}</div>
      <div>
        <div class="ceja">${ceja}</div>
        <div class="titulo" style="font-size:64px; margin-top:10px">${titulo}</div>
      </div>
    </div>
    ${cuerpo ? `<div class="cuerpo">${cuerpo}</div>` : ""}
  </div>`;

const modo = ({ nombre, color, icono, datos, para }) => `
  <div class="panel modo" style="--acento:${color}">
    <div class="ceja">Programa</div>
    <div class="cabeza" style="margin-top:22px">
      <div class="icono" style="color:${color}">${IC[icono]}</div>
      <div class="nombre sombra-texto">${nombre}</div>
    </div>
    <div class="datos">${datos.map(d => `<span class="pastilla">${d}</span>`).join("")}</div>
    <div class="para">${para}</div>
  </div>`;

const medidor = (valor, color, estado, sub) => `
  <div class="panel" style="top:300px; left:64px; width:876px; --acento:${color}">
    <div class="ceja sin-punto" style="justify-content:space-between">
      <span style="display:flex;align-items:center;gap:14px"><i style="width:14px;height:14px;border-radius:50%;background:var(--acento);box-shadow:0 0 16px var(--acento)"></i>Sensor de turbidez</span>
      <span class="mono" style="font-size:24px;letter-spacing:.12em;color:var(--tenue)">● EN DIRECTO</span>
    </div>
    <div class="medidor">
      <div class="rot"><span>LUZ RECIBIDA</span><b>${valor}<small style="font-size:64px"> %</small></b></div>
      <div class="tubo"><i style="width:${valor}%"></i></div>
      <div class="marcas"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
    </div>
    <div style="margin-top:34px; display:flex; align-items:center; gap:22px">
      <div class="icono" style="color:${color}; width:84px; height:84px">${IC[valor > 50 ? "check" : "ojo"]}</div>
      <div>
        <div class="titulo" style="font-size:60px; margin-top:0; color:${color}">${estado}</div>
        <div class="cuerpo" style="margin-top:6px; font-size:36px">${sub}</div>
      </div>
    </div>
  </div>`;

// ---------------------------------------------------------------------------
// Los gráficos
// ---------------------------------------------------------------------------
const G = {};

G.titulo = () => `
  <div style="position:absolute; left:0; right:0; top:690px; text-align:center">
    <svg width="120" height="150" viewBox="0 0 64 80" style="filter: drop-shadow(0 0 30px rgba(79,214,255,.7))">
      <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fbff"/><stop offset="1" stop-color="#4fd6ff"/></linearGradient></defs>
      <path d="M32 4 C24 20 10 34 10 50 a22 22 0 0 0 44 0 C54 34 40 20 32 4Z" fill="url(#gg)"/>
      <path d="M22 52 a10 10 0 0 0 10 10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
    </svg>
    <div class="sombra-texto" style="font-family:'Inter Display'; font-weight:800; font-size:62px; letter-spacing:.32em; margin-top:26px; padding-left:.32em; color:#dff7ff">DENTRO DEL</div>
    <div style="font-family:'Inter Display'; font-weight:900; font-size:132px; letter-spacing:-.025em; line-height:1; margin-top:6px;
                background: linear-gradient(180deg, #ffffff 0%, #dff7ff 45%, #59d9ff 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
                filter: drop-shadow(0 6px 26px rgba(0,0,0,.55)) drop-shadow(0 0 40px rgba(79,214,255,.35))">LAVAVAJILLAS</div>
    <div style="margin-top:40px"><span class="pastilla" style="--acento:var(--agua); font-size:40px; padding:16px 34px">Así lava de verdad</span></div>
  </div>`;

G.manchas = () => {
  const chip = (color, a, b) => `
    <div class="panel" style="position:relative; padding:28px 32px; border-radius:28px; --acento:${color}; border-color:color-mix(in srgb, ${color} 60%, transparent)">
      <div style="display:flex; align-items:center; gap:18px">
        <span style="width:26px;height:26px;border-radius:50%;background:${color};box-shadow:0 0 18px ${color}"></span>
        <span style="font-family:'Inter Display'; font-weight:900; font-size:46px">${a}</span>
      </div>
      <div class="cuerpo" style="margin-top:8px; font-size:36px; padding-left:44px">${b}</div>
    </div>`;
  return `
  <div style="position:absolute; left:64px; top:290px; width:876px">
    <div class="ceja sombra-texto" style="--acento:#fff; font-size:30px">Cada mancha es distinta</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:26px">
      ${chip("#ffc94d", "PROTEÍNA", "huevo, carne")}
      ${chip("#ff6b5a", "GRASA", "tomate, aceite")}
      ${chip("#f3e6c8", "ALMIDÓN", "arroz, pasta")}
      ${chip("#c98b5a", "TANINOS", "café, té, vino")}
    </div>
  </div>`;
};

G.descalcificador = () => `
  <div class="panel" style="top:300px; left:64px; width:876px; --acento:var(--agua)">
    <div class="ceja">Antes de lavar</div>
    <div class="titulo">DESCALCIFICADOR</div>
    <div style="display:flex; flex-direction:column; gap:26px; margin-top:34px">
      <div class="fila"><div class="icono" style="color:#ffb547; --acento:#ffb547">${IC.bolitas}</div>
        <div class="cuerpo" style="margin:0"><b>Resina:</b> atrapa la cal<br><span style="color:var(--tenue); font-size:32px">(el calcio y el magnesio del agua)</span></div></div>
      <div class="fila"><div class="icono" style="color:#fff; --acento:#ffffff">${IC.piedra}</div>
        <div class="cuerpo" style="margin:0"><b>Sal:</b> limpia la resina para que vuelva a funcionar</div></div>
    </div>
  </div>`;

G.litros = () => `
  <div class="panel" style="top:300px; left:64px; width:876px; text-align:center; padding:50px 40px 54px">
    <div class="ceja" style="justify-content:center">Agua en el fondo</div>
    <div style="font-family:'Inter Display'; font-weight:900; font-size:230px; letter-spacing:-.04em; line-height:1; margin-top:14px;
                background:linear-gradient(180deg,#fff 10%,#59d9ff 100%); -webkit-background-clip:text; background-clip:text; color:transparent">3–4 L</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:20px; margin-top:20px">
      <span style="color:var(--agua); width:70px; height:70px; display:inline-block">${IC.ciclo}</span>
      <span class="cuerpo" style="margin:0; font-size:42px"><b>se reciclan</b> una y otra vez</span>
    </div>
  </div>`;

G.brazo = () => `
  <div class="panel" style="top:300px; left:64px; width:876px; --acento:var(--agua)">
    <div class="ceja">Brazo aspersor</div>
    <div class="titulo">GIRA SOLO</div>
    <svg viewBox="0 0 780 300" width="776" height="298" style="margin-top:20px">
      <defs>
        <linearGradient id="jet" x1="0" x2="1"><stop offset="0" stop-color="#9be9ff" stop-opacity=".95"/><stop offset="1" stop-color="#9be9ff" stop-opacity="0"/></linearGradient>
        <marker id="fl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb547"/></marker>
      </defs>
      <!-- brazo -->
      <rect x="140" y="138" width="500" height="34" rx="17" fill="#8a96a3" stroke="#d7e2ec" stroke-width="3"/>
      <circle cx="390" cy="155" r="30" fill="#5d6874" stroke="#d7e2ec" stroke-width="3"/>
      <!-- chorros inclinados -->
      ${[180, 250, 320].map(x => `<path d="M${x} 140 L${x - 60} 40" stroke="url(#jet)" stroke-width="12" stroke-linecap="round" transform="rotate(0)"/>`).join("")}
      ${[460, 530, 600].map(x => `<path d="M${x} 170 L${x + 60} 270" stroke="url(#jet)" stroke-width="12" stroke-linecap="round"/>`).join("")}
      <!-- giro -->
      <path d="M520 60 A200 120 0 0 1 700 150" stroke="#ffb547" stroke-width="7" fill="none" marker-end="url(#fl)" stroke-linecap="round"/>
      <path d="M260 250 A200 120 0 0 1 80 160" stroke="#ffb547" stroke-width="7" fill="none" marker-end="url(#fl)" stroke-linecap="round"/>
    </svg>
    <div class="cuerpo" style="margin-top:6px">Los chorros salen <b>inclinados</b> y lo empujan: acción y reacción. <span style="color:var(--tenue)">Nadie lo mueve.</span></div>
  </div>`;

G.fase1 = () => fase(1, "PRELAVADO", "#4fd6ff");
G.fase2 = () => fase(2, "LAVADO PRINCIPAL", "#ffb547");
G.fase3 = () => fase(3, "ACLARADO", "#7ff0ff");
G.fase4 = () => fase(4, "SECADO", "#b98cff");

G.filtro = () => callout({ icono: "filtro", ceja: "Filtro", titulo: "ATRAPA LOS RESTOS", cuerpo: "Así la comida <b>no vuelve</b> a los platos." });

G.sensor_esquema = () => `
  <div class="panel" style="top:300px; left:64px; width:876px; --acento:#ff5a5a">
    <div class="ceja">Así funciona</div>
    <div class="titulo">SENSOR DE<br>TURBIDEZ</div>
    <svg viewBox="0 0 780 330" width="776" height="328" style="margin-top:26px">
      <defs>
        <linearGradient id="haz" x1="0" x2="1"><stop offset="0" stop-color="#ff4d4d"/><stop offset="1" stop-color="#ffd0d0"/></linearGradient>
        <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd6ff" stop-opacity=".35"/><stop offset="1" stop-color="#4fd6ff" stop-opacity=".12"/></linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>
      <!-- canal de agua -->
      <rect x="250" y="40" width="280" height="200" rx="18" fill="url(#agua)" stroke="#9be9ff" stroke-width="3"/>
      ${[80, 120, 160, 200].map((y, i) => `<path d="M270 ${y} q35 -14 70 0 t70 0 t70 0 t50 0" stroke="#9be9ff" stroke-opacity=".45" stroke-width="3" fill="none"/>`).join("")}
      <!-- emisor -->
      <rect x="40" y="95" width="120" height="90" rx="16" fill="#1d2a36" stroke="#ff7070" stroke-width="3"/>
      <circle cx="160" cy="140" r="22" fill="#ff3b3b"/>
